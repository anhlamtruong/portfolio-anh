      // Wave-local time u = t + SHIFT (mod 2.5). Chosen so that frame 0 sits

      var LOG = [
        ["planner", "split request → 3 tasks"],
        ["coder", "patch api/orders.ts  +42 −7"],
        ["designer", "tokens → ui/Button.tsx"],

      var LOG_LH = 38;
      var LOG_ROWS = 7;
      var LOG_BOTTOM = 178; // top of the newest row inside #cs-log-lines

      // ---------------- helpers ----------------
      function mod(a, n) {
        return ((a % n) + n) % n;
      }
      function clamp01(x) {
        return x < 0 ? 0 : x > 1 ? 1 : x;
      }
      function inOut2(p) {

      }
      function expoOut(p) {
        return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
      }
      function out3(p) {
        return 1 - Math.pow(1 - p, 3);

      function rgba(hex, a) {
        var n = parseInt(hex.slice(1), 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a.toFixed(3) + ")";

      function mixHex(a, b, f) {

        function ch(sh) {

          return Math.round(u + (w - u) * f);

        return "rgb(" + ch(16) + "," + ch(8) + "," + ch(0) + ")";

      // ---------------- nodes ----------------
      var nodeEls = {};

      el("circle", { cx: 100.5, cy: 331, r: 2.5, fill: "#2a3546" }, ruler);

      for (var hc = 0; hc < COLS.length - 1; hc++) {
        var mx = Math.round((COLS[hc].x + COLS[hc + 1].x) / 2) + 0.5;

      // ---------------- edges ----------------
      function rightOf(id) {
        var n = NODES[id];

      }
      function leftOf(id) {
        var n = NODES[id];
        return [n.x - n.w / 2, n.y];
      }
      var EDGES = [
        { id: "in", a: [0, 304], b: leftOf("planner"), color: C.input, dash: true },
        { id: "pd", a: rightOf("planner"), b: leftOf("designer"), color: C.planner, src: "planner", dst: "designer" },
        { id: "pc", a: rightOf("planner"), b: leftOf("coder"), color: C.planner, src: "planner", dst: "coder" },
        { id: "pl", a: rightOf("planner"), b: leftOf("layout"), color: C.planner, src: "planner", dst: "layout" },
        { id: "dr", a: rightOf("designer"), b: leftOf("reviewer"), color: C.designer, src: "designer", dst: "reviewer", dash: true },
        { id: "cr", a: rightOf("coder"), b: leftOf("reviewer"), color: C.coder, src: "coder", dst: "reviewer", dash: true },
        { id: "ct", a: rightOf("coder"), b: leftOf("tester"), color: C.coder, src: "coder", dst: "tester", dash: true },
        { id: "lt", a: rightOf("layout"), b: leftOf("tester"), color: C.layout, src: "layout", dst: "tester", dash: true },
        { id: "rd", a: rightOf("reviewer"), b: leftOf("deployer"), color: C.reviewer, src: "reviewer", dst: "deployer" },
        { id: "td", a: rightOf("tester"), b: leftOf("deployer"), color: C.tester, src: "tester", dst: "deployer" },
        { id: "dp", a: rightOf("deployer"), b: leftOf("prod"), color: C.deployer, src: "deployer", dst: "prod" },
        { id: "pm", a: [1122, 304 + NODE_H / 2], b: [1122, 468], color: C.prod, src: "prod", dst: "card", vertical: true, dash: true },
      ];
      var EDGE = {};

      var defs = document.getElementById("cs-defs");
      var gEdges = document.getElementById("cs-edges");
      var gTrails = document.getElementById("cs-trails");
      var gPackets = document.getElementById("cs-packets");

      // one soft halo gradient per colour
      Object.keys(C).forEach(function (k) {
        var g = el("radialGradient", { id: "cs-halo-" + k }, defs);
        el("stop", { offset: "0%", "stop-color": C[k], "stop-opacity": 0.55 }, g);
        el("stop", { offset: "45%", "stop-color": C[k], "stop-opacity": 0.18 }, g);
        el("stop", { offset: "100%", "stop-color": C[k], "stop-opacity": 0 }, g);
      });
      function colorKey(hex) {
        for (var k in C) if (C[k] === hex) return k;
        return "prod";
      }

      EDGES.forEach(function (e) {
        var x0 = e.a[0], y0 = e.a[1], x3 = e.b[0], y3 = e.b[1];
        var p1, p2;
        if (e.vertical) {
          var ky = (y3 - y0) * 0.5;
          p1 = [x0, y0 + ky];
          p2 = [x3, y3 - ky];
        } else {
          var k = (x3 - x0) * 0.55;
          p1 = [x0 + k, y0];
          p2 = [x3 - k, y3];
        }
        e.P = [[x0, y0], p1, p2, [x3, y3]];
        var d =
          "M" + x0 + " " + y0 + " C" + p1[0] + " " + p1[1] + " " + p2[0] + " " + p2[1] + " " + x3 + " " + y3;
        e.base = el(
          "path",
          {
            d: d,
            fill: "none",
            stroke: e.id === "pm" ? "rgba(94,234,212,0.35)" : "#2a3546",
            "stroke-width": 1.5,
            "stroke-dasharray": e.dash ? "6 7" : "none",
          },
          gEdges
        );
        e.trail = el(
          "path",
          {
            d: d,
            fill: "none",
            stroke: e.color,
            "stroke-width": 2,
            "stroke-linecap": "round",
            pathLength: 1000,
            "stroke-dasharray": "0 2000",
            opacity: 0,
          },
          gTrails

        var key = colorKey(e.color);
        e.halo = el("circle", { cx: 0, cy: 0, r: 22, fill: "url(#cs-halo-" + key + ")", opacity: 0 }, gPackets);
        e.dot = el("circle", { cx: 0, cy: 0, r: 6, fill: e.color, opacity: 0 }, gPackets);

        var a = m * m * m, b = 3 * m * m * q, c = 3 * m * q * q, d = q * q * q;
        return [
          a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0],
          a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1],
        ];
      }

      // ---------------- schedule ----------------
      var WAVES = [
        { s1: ["pd", "pc"], s2: ["dr", "ct"] },
        { s1: ["pc", "pl"], s2: ["cr", "lt"] },
        { s1: ["pd", "pc", "pl"], s2: ["dr", "cr", "lt"] },
        { s1: ["pd", "pl"], s2: ["dr", "lt"] },
      ];
      var TRAVELS = []; // { e, d: depart (abs, mod 10), dur }
      var GLOWS = []; // { node, at (abs, mod 10), s }
      function travel(id, u, dur, w) {
        var d = mod(u + WAVE * w - SHIFT, LOOP);
        TRAVELS.push({ e: id, d: d, dur: dur });
        var e = EDGE[id];
        if (e.src) GLOWS.push({ node: e.src, at: mod(d - 0.04, LOOP), s: 0.4 });
        if (e.dst) GLOWS.push({ node: e.dst, at: mod(d + dur, LOOP), s: 1 });
        if (id === "in") GLOWS.push({ node: "planner", at: mod(d + dur, LOOP), s: 1 });
      }
      WAVES.forEach(function (wv, w) {
        travel("in", -0.34, 0.3, w);
        wv.s1.forEach(function (id, i) { travel(id, 0.0 + 0.07 * i, 0.5, w); });
        wv.s2.forEach(function (id, i) { travel(id, 0.62 + 0.07 * i, 0.5, w); });
        travel("rd", 1.22, 0.42, w);
        travel("td", 1.28, 0.42, w);
        travel("dp", 1.66, 0.38, w);
        travel("pm", 2.06, 0.3, w); // lands at u = 2.36 -> metric phase start
      });
      // metric phase k starts at M_k = 2.36 - SHIFT + 2.5k = 0.9 + 2.5k
      var M0 = mod(2.36 - SHIFT, WAVE);

      // ---------------- log rows ----------------
      var logBox = document.getElementById("cs-log-lines");
      var rows = [];
      for (var r = 0; r < LOG_ROWS; r++) {
        var row = document.createElement("div");
        row.className = "cs-row";
        row.id = "cs-row-" + r;
        var pr = document.createElement("span");
        pr.textContent = "› ";
        pr.style.color = "#747e8b";
        var tag = document.createElement("span");
        tag.className = "cs-tag";
        var msg = document.createElement("span");
        var caret = document.createElement("span");
        caret.className = "cs-caret";
        row.appendChild(pr);
        row.appendChild(tag);
        row.appendChild(msg);
        row.appendChild(caret);
        logBox.appendChild(row);
        rows.push({ row: row, tag: tag, msg: msg, caret: caret });
      }

      // ---------------- metrics ----------------
      var mBox = document.getElementById("cs-metrics");
      var metricEls = METRICS.map(function (m, mi) {
        var wrap = document.createElement("div");
        wrap.className = "cs-metric";
        wrap.id = "cs-metric-" + mi;
        var num = document.createElement("div");
        num.className = "cs-num";
        var cols = [];
        var syms = [];
        for (var i = 0; i < m.value.length; i++) {
          var ch = m.value.charAt(i);
          if (/\d/.test(ch)) {
            var col = document.createElement("span");
            col.className = "cs-col";
            // the drum is clipped by its column; its off-window digits are
            // not on screen, so keep them out of the layout audit
            col.setAttribute("data-layout-allow-overflow", "");
            var strip = document.createElement("span");
            strip.className = "cs-strip";
            strip.setAttribute("data-layout-ignore", "");
            var stops = 10 + Number(ch); // one full turn, then land
            for (var s = 0; s <= stops; s++) {
              var dg = document.createElement("span");
              dg.textContent = String(s % 10);
              strip.appendChild(dg);
            }
            col.appendChild(strip);
            num.appendChild(col);
            cols.push({ col: col, strip: strip, stops: stops });
          } else {
            var sy = document.createElement("span");
            sy.className = "cs-sym " + (ch === "+" || ch === "×" ? "cs-acc" : "cs-punct");
            sy.textContent = ch;
            num.appendChild(sy);
            syms.push(sy);
          }
        }
        var lab = document.createElement("div");
        lab.className = "cs-mlabel";
        lab.textContent = m.label;
        wrap.appendChild(num);
        wrap.appendChild(lab);
        mBox.appendChild(wrap);
        return { wrap: wrap, cols: cols, syms: syms, label: lab };
      });
      var segs = Array.prototype.slice.call(document.querySelectorAll("#cs-segs .cs-seg i"));
      var idxEl = document.getElementById("cs-idx");
      var cardGlow = document.getElementById("cs-card-glow");
      var liveDot = document.getElementById("cs-live-dot");

      // ---------------- paint(t) ----------------
      function paint(tRaw) {
        var t = mod(tRaw, LOOP);

        // node glow
        var glow = {};
        for (var i = 0; i < GLOWS.length; i++) {
          var G = GLOWS[i];
          var v = G.s * env(mod(t - G.at, LOOP), G.node === "card" ? 0.6 : 0.5);
          glow[G.node] = (glow[G.node] || 0) + v;
        }
        Object.keys(nodeEls).forEach(function (id) {
          var g = Math.min(1, glow[id] || 0);
          var col = C[id];
          var d = nodeEls[id];
          d.style.borderColor = id === "prod" ? rgba(col, 0.45 + 0.55 * g) : mixHex("#2a3546", col, g);
          d.style.boxShadow =
            g > 0.002 ? "0 0 " + (10 + 26 * g).toFixed(1) + "px " + rgba(col, 0.5 * g) : "none";
          d.style.background = g > 0.002 ? "linear-gradient(" + rgba(col, 0.1 * g) + "," + rgba(col, 0.1 * g) + "), #0c1017" : "#0c1017";
        });

        // packets + trails
        EDGES.forEach(function (e) {
          var p = -1, after = 99;
          for (var j = 0; j < TRAVELS.length; j++) {
            var T = TRAVELS[j];
            if (T.e !== e.id) continue;
            var dt = mod(t - T.d, LOOP);
            if (dt < T.dur) p = dt / T.dur;
            else after = Math.min(after, dt - T.dur);
          }
          if (p >= 0) {
            var q = inOut2(p);
            var pt = bez(e.P, q);
            var a = clamp01(p / 0.1) * (1 - clamp01((p - 0.9) / 0.1));
            e.dot.setAttribute("cx", pt[0].toFixed(2));
            e.dot.setAttribute("cy", pt[1].toFixed(2));
            e.halo.setAttribute("cx", pt[0].toFixed(2));
            e.halo.setAttribute("cy", pt[1].toFixed(2));
            e.dot.setAttribute("opacity", a.toFixed(3));
            e.halo.setAttribute("opacity", a.toFixed(3));
            e.trail.setAttribute("stroke-dasharray", (q * 1000).toFixed(1) + " 2000");
            e.trail.setAttribute("opacity", "0.7");
          } else {
            e.dot.setAttribute("opacity", "0");
            e.halo.setAttribute("opacity", "0");
            var fa = after < 0.9 ? 0.7 * Math.pow(1 - after / 0.9, 2) : 0;
            e.trail.setAttribute("stroke-dasharray", "1000 2000");
            e.trail.setAttribute("opacity", fa.toFixed(3));
          }
          if (e.dash) {
            // dash period 13; 8 periods per loop -> seamless
            e.base.setAttribute("stroke-dashoffset", (-t * 10.4).toFixed(2));
          }
        });

        // live dot
        liveDot.style.opacity = (0.35 + 0.65 * (0.5 + 0.5 * Math.cos((2 * Math.PI * t) / 1.25))).toFixed(3);

        // ---- log ----
        var tau = (t - LOG_T0) / LOG_DT;
        var base = Math.floor(tau);
        var elapsed = (tau - base) * LOG_DT;
        var newest = base + 7;
        var e3 = out3(clamp01(elapsed / 0.38));
        for (var r2 = 0; r2 < rows.length; r2++) {
          var R = rows[r2];
          var line = LOG[mod(newest - r2, LOG.length)];
          var slot = r2 - 1 + e3;
          var y = LOG_BOTTOM - slot * LOG_LH;
          R.row.style.transform = "translate3d(0," + y.toFixed(2) + "px,0)";
          R.tag.textContent = line[0];
          R.tag.style.color = C[line[0]];
          if (r2 === 0) {
            var n = Math.floor(line[1].length * clamp01((elapsed - 0.06) / 0.42));
            R.msg.textContent = line[1].slice(0, n);
            var typing = n < line[1].length;
            var blinkOn = typing || mod(t, 0.625) < 0.3125;
            R.caret.style.opacity = blinkOn ? "1" : "0";
            R.row.style.opacity = "1";
            R.msg.style.color = "#e8edf4";
          } else {
            R.msg.textContent = line[1];
            R.caret.style.opacity = "0";
            R.row.style.opacity = Math.max(0.28, 1 - 0.16 * slot).toFixed(3);
            R.msg.style.color = "#aeb8c5";
          }
        }

        // ---- metrics ----
        var v2 = (t - M0) / WAVE;
        var k = Math.floor(v2);
        var l = (v2 - k) * WAVE; // seconds into this metric's phase
        // align so the phase that holds frame 0 shows 837+ (01 / 04)
        var show = mod(k - Math.floor(-M0 / WAVE), 4);
        idxEl.textContent = "0" + (show + 1) + " / 04";
        for (var m = 0; m < metricEls.length; m++) {
          var ME = metricEls[m];
          if (m !== show) {
            ME.wrap.style.opacity = "0";
            continue;
          }
          var exitP = clamp01((l - (WAVE - 0.2)) / 0.2);
          ME.wrap.style.opacity = (1 - exitP).toFixed(3);
          ME.wrap.style.filter = exitP > 0 ? "blur(" + (8 * exitP).toFixed(2) + "px)" : "none";
          for (var c = 0; c < ME.cols.length; c++) {
            var CC = ME.cols[c];
            var lc = l - 0.07 * c;
            var qn = clamp01(lc / 0.95);
            var qq = expoOut(qn);
            CC.strip.style.transform = "translate3d(0," + (-qq * CC.stops).toFixed(4) + "em,0)";
            // roll blur from the drum's speed (em per frame at 30 fps)
            var vel = qn > 0 && qn < 1 ? (CC.stops * 10 * Math.LN2 * Math.pow(2, -10 * qn)) / 0.95 / 30 : 0;
            var bl = Math.min(6, vel * 104 * 0.3);
            CC.strip.style.filter = bl > 0.15 ? "blur(" + bl.toFixed(2) + "px)" : "none";
            CC.col.style.opacity = clamp01(lc / 0.12).toFixed(3);
          }
          var so = clamp01((l - 0.05) / 0.2).toFixed(3);
          for (var s2 = 0; s2 < ME.syms.length; s2++) ME.syms[s2].style.opacity = so;
          var lp = clamp01((l - 0.25) / 0.25);
          ME.label.style.opacity = lp.toFixed(3);
          ME.label.style.filter = lp < 1 ? "blur(" + (6 * (1 - lp)).toFixed(2) + "px)" : "none";
        }
        for (var sg = 0; sg < segs.length; sg++) {
          segs[sg].style.transform = "scaleX(" + (sg === show ? clamp01(l / WAVE) : 0).toFixed(4) + ")";
        }
        var cg = Math.min(1, glow.card || 0);
        cardGlow.style.opacity = cg.toFixed(3);
        cardGlow.style.boxShadow = cg > 0.002 ? "0 0 " + (28 * cg).toFixed(1) + "px " + rgba(C.prod, 0.35 * cg) : "none";
      }

      // GSAP suppresses callbacks on seek(); a setter on the tweened driver
      // always runs, so the frame is painted from the timeline's own time.
      var driverT = 0;
      var driver = {};
      Object.defineProperty(driver, "t", {
        configurable: true,
        get: function () {
          return driverT;
        },
        set: function (value) {
          driverT = value;
          paint(value);
        },
      });

      var tl = gsap.timeline({ paused: true });
      tl.to(driver, { t: LOOP, duration: LOOP, ease: "none" }, 0);
      paint(0);
      window.__timelines["console"] = tl;
    })();
  </script>
</template>
