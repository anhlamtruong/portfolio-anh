<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/GeistVF.woff") format("woff"); font-weight: 100 900; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMonoVF.woff") format("woff"); font-weight: 100 900; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #07090d;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #07090d;
      }
    </style>
  </head>
  <body>
    <!-- Showreel: an orchestration console that loops seamlessly every 10 s.
         One scene (compositions/console.html) draws everything as a pure
         function of time mod 10, so the frame at t = 10 equals frame 0. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1280"
      data-height="800"
    >
      <div id="ground"></div>
      <div
        id="console"
        data-composition-id="console"
        data-composition-src="compositions/console.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1280"
        data-height="800"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
