<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/GeistVF.woff") format("woff"); font-weight: 100 900; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMonoVF.woff") format("woff"); font-weight: 100 900; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }

      :root {
        --ground: #07090d;
        --panel: #0c1017;
        --line: #1c2431;
        --line-strong: #2a3546;
        --text: #e8edf4;
        --muted: #8a97a8;
        --dim: #5b6676;
        --accent: #5eead4;
        --violet: #a78bfa;
        --violet-soft: #c4b5fd;
        --amber: #fbbf24;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: var(--ground);
        font-family: "Geist", sans-serif;
        color: var(--text);
      }

      /* ---- shared frame language (all four project clips) ---- */
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(120, 140, 170, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(120, 140, 170, 0.07) 1px, transparent 1px),
          linear-gradient(to right, rgba(120, 140, 170, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(120, 140, 170, 0.035) 1px, transparent 1px);
        background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
      }
      #foot { position: absolute; left: 40px; right: 40px; top: 736px; height: 64px; }
      #foot-rule {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 10px;
        border-top: 1px solid var(--line-strong);
        background-image:
          repeating-linear-gradient(to right, var(--line-strong) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 20px);
        background-size: 100% 10px, 100% 5px;
        background-repeat: no-repeat;
      }
      #foot-tag {
        position: absolute;
        left: 0;
        top: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Geist Mono", monospace;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--muted);
        white-space: nowrap;
      }
      #foot-tag .idx { color: var(--accent); }
      #foot-tag .sep { color: var(--dim); }
      #foot-readout {
        position: absolute;
        right: 0;
        top: 24px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }

      .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: 14px;
      }

      /* ---- product window (real screenshot) ---- */
      #win {
        left: 372px;
        top: 140px;
        width: 868px;
        height: 539px;
        overflow: hidden;
        box-shadow: 0 0 70px -18px rgba(167, 139, 250, 0.4);
      }
      #win-bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-strong);
      }
      #win-bar .d { width: 11px; height: 11px; border-radius: 50%; background: var(--line-strong); }
      #win-bar .url {
        margin-left: 18px;
        height: 28px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        border-radius: 8px;
        background: #121925;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }
      #shot {
        position: absolute;
        left: 0;
        top: 42px;
        width: 868px;
        height: 497px;
        object-fit: cover;
        object-position: 50% 0%;
      }
      .bracket {
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: var(--accent);
        border-style: solid;
        border-width: 0;
      }

      /* ---- KPI tiles ---- */
      .kpi {
        left: 40px;
        width: 300px;
        height: 118px;
        padding: 16px 20px;
      }
      .kpi .glow {
        position: absolute;
        inset: -1px;
        border-radius: 14px;
        border: 1.5px solid var(--accent);
        box-shadow: 0 0 30px -8px rgba(94, 234, 212, 0.6);
        opacity: 0;
      }
      .kpi .l {
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }
      .kpi .v {
        margin-top: 2px;
        font-family: "Geist Mono", monospace;
        font-size: 42px;
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 48px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .kpi .v span { color: var(--violet); }
      .kpi .dlt {
        position: absolute;
        right: 20px;
        top: 16px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* ---- forecast chart ---- */
      #chart {
        left: 40px;
        top: 424px;
        width: 580px;
        height: 290px;
      }
      #chart-head {
        position: absolute;
        left: 22px;
        right: 22px;
        top: 16px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #chart-head .t {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      #chart-head .t em {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0;
        color: var(--accent);
      }
      #ml {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }
      #ml i { width: 9px; height: 9px; border-radius: 50%; display: block; }
      #plot { position: absolute; left: 0; top: 0; width: 580px; height: 290px; overflow: visible; }
      .clbl {
        position: absolute;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        white-space: nowrap;
      }

      /* ---- AI insight ---- */
      #ins {
        left: 660px;
        top: 512px;
        width: 580px;
        height: 202px;
        padding: 18px 22px;
        transform-origin: 50% 100%;
      }
      #ins .edge {
        position: absolute;
        inset: -1px;
        border-radius: 14px;
        border: 1.5px solid rgba(167, 139, 250, 0.8);
        box-shadow: 0 0 36px -10px rgba(167, 139, 250, 0.75);
      }
      #ins-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
      }
      #ins-head .k {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--violet-soft);
        white-space: nowrap;
      }
      #ins-head .k i { width: 10px; height: 10px; border-radius: 3px; background: var(--violet); display: block; }
      #voice {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }
      #vbars { position: relative; width: 58px; height: 28px; }
      .vb {
        position: absolute;
        top: 0;
        width: 4px;
        height: 28px;
        border-radius: 2px;
        background: var(--violet-soft);
      }
      #ins-txt {
        margin-top: 12px;
        font-size: 27px;
        font-weight: 500;
        line-height: 35px;
        letter-spacing: -0.02em;
      }
      #ins-txt b { font-weight: 650; color: #fff; }
      .w { display: inline-block; }
      #audit {
        position: absolute;
        left: 22px;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--muted);
        white-space: nowrap;
      }
      #audit .ck {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(94, 234, 212, 0.14);
        border: 1px solid rgba(94, 234, 212, 0.6);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
      }
      #audit b { color: var(--text); font-weight: 500; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1280"
      data-height="800"
    >
      <div id="grid"></div>

      <div id="win" class="panel">
        <div id="win-bar">
          <div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="url">finhack · overview</div>
        </div>
        <img id="shot" src="assets/finhack.png" alt="FinHack Finance overview dashboard" />
        <!-- AI reads the Expenses card: brackets drawn on the real screenshot -->
        <div id="brk" style="position: absolute; inset: 0">
          <div class="bracket" style="left: 550px; top: 184px; border-top-width: 3px; border-left-width: 3px"></div>
          <div class="bracket" style="left: 745px; top: 184px; border-top-width: 3px; border-right-width: 3px"></div>
          <div class="bracket" style="left: 550px; top: 272px; border-bottom-width: 3px; border-left-width: 3px"></div>
          <div class="bracket" style="left: 745px; top: 272px; border-bottom-width: 3px; border-right-width: 3px"></div>
        </div>
      </div>

      <div id="kpi-1" class="panel kpi" style="top: 148px">
        <div class="glow"></div>
        <div class="l">income</div>
        <div class="v"><span>$</span>7,270.19</div>
        <div class="dlt">−8%</div>
      </div>
      <div id="kpi-2" class="panel kpi" style="top: 282px">
        <div class="glow" id="kpi-2-glow"></div>
        <div class="l">expenses</div>
        <div class="v"><span>$</span>4,543.25</div>
        <div class="dlt" id="kpi-2-dlt">+5%</div>
      </div>

      <div id="chart" class="panel">
        <svg id="plot" viewBox="0 0 580 290">
          <defs>
            <clipPath id="fc-clip" clipPathUnits="userSpaceOnUse">
              <rect id="fc-rect" x="340" y="40" width="220" height="250" />
            </clipPath>
            <linearGradient id="act-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22" />
              <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g id="gridlines"></g>
          <path id="act-area" fill="url(#act-fill)" />
          <path id="act-line" fill="none" stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="340" y1="72" x2="340" y2="262" stroke="#5b6676" stroke-width="1.5" stroke-dasharray="4 5" />
          <g id="fc" clip-path="url(#fc-clip)">
            <path id="fc-band" fill="#5eead4" fill-opacity="0.13" />
            <path id="fc-line" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round" />
          </g>
          <circle id="today-dot" cx="340" r="7" fill="#a78bfa" stroke="#0c1017" stroke-width="3" />
          <circle id="fc-dot" r="7" fill="#5eead4" stroke="#0c1017" stroke-width="3" />
        </svg>
        <div id="chart-head">
          <div class="t">cash flow <em>forecast</em></div>
          <div id="ml"><i id="ml-dot"></i><span id="ml-txt">Snowflake ML ✓</span></div>
        </div>
        <div class="clbl" style="left: 300px; top: 262px; color: #8a97a8">today</div>
        <div class="clbl" id="fc-lbl" style="right: 22px; top: 252px; color: #5eead4">next</div>
      </div>

      <div id="ins" class="panel">
        <div class="edge"></div>
        <div id="ins-head">
          <div class="k"><i></i>AI insight</div>
          <div id="voice"><div id="vbars"></div>voice</div>
        </div>
        <div id="ins-txt"><span id="ins-words">Expenses are <b>up 5%</b> on last period, and rent is <b>46%</b> of spending.</span></div>
        <div id="audit"><span class="ck">✓</span><span><b>audit</b> logged on-chain</span></div>
      </div>

      <div id="foot">
        <div id="foot-rule"></div>
        <div id="foot-tag">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1v16M1 9h16" stroke="#5b6676" stroke-width="1.5" /><circle cx="9" cy="9" r="4" fill="none" stroke="#5eead4" stroke-width="1.5" /></svg>
          <span><span class="idx">04</span><span class="sep"> / </span>finhack</span>
        </div>
        <div id="foot-readout">forecasting · voice · on-chain audit</div>
      </div>
    </div>

    <script>
      (function () {
        var LOOP = 6;
        var W = (2 * Math.PI) / LOOP;
        var T = {
          insOut: 2.2,   // insight leaves
          fcOut: 2.3,    // old forecast fades
          fcIn: 2.75,    // new forecast draws (model re-run)
          fcDone: 3.95,
          insIn: 4.15,   // insight pops in and is read aloud
          audit: 5.3,    // logged on-chain
        };
        var NS = "http://www.w3.org/2000/svg";
        var $ = function (id) { return document.getElementById(id); };

        // ---------- chart geometry (illustrative shape, no values shown) ----------
        var X0 = 30, XT = 340, X1 = 548, YB = 262, YH = 186;
        var act = [0.36, 0.44, 0.38, 0.5, 0.45, 0.57, 0.52, 0.47, 0.6, 0.55, 0.64, 0.6, 0.69];
        var fc = [0.69, 0.71, 0.7, 0.75, 0.78, 0.82];
        var band = [0, 0.03, 0.05, 0.075, 0.1, 0.12];
        function px(i, n, a, b) { return a + (i / (n - 1)) * (b - a); }
        function py(v) { return YB - v * YH + 20; }
        function smooth(pts) {
          var d = "M" + pts[0][0] + " " + pts[0][1];
          for (var i = 0; i < pts.length - 1; i++) {
            var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
            var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
            var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
            d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
          }
          return d;
        }
        var aPts = act.map(function (v, i) { return [px(i, act.length, X0, XT), py(v)]; });
        var fPts = fc.map(function (v, i) { return [px(i, fc.length, XT, X1), py(v)]; });
        var hi = fc.map(function (v, i) { return [fPts[i][0], py(v + band[i])]; });
        var lo = fc.map(function (v, i) { return [fPts[i][0], py(v - band[i])]; }).reverse();
        $("act-line").setAttribute("d", smooth(aPts));
        $("act-area").setAttribute("d", smooth(aPts) + " L" + XT + " " + (YB + 20) + " L" + X0 + " " + (YB + 20) + " Z");
        $("fc-line").setAttribute("d", smooth(fPts));
        $("fc-band").setAttribute("d", smooth(hi) + " L" + lo[0][0] + " " + lo[0][1] + smooth(lo).replace(/^M[^C]+/, " ") + " Z");
        $("today-dot").setAttribute("cy", aPts[aPts.length - 1][1]);
        $("fc-dot").setAttribute("cx", X1);
        $("fc-dot").setAttribute("cy", fPts[fPts.length - 1][1]);
        $("fc-lbl").style.top = (fPts[fPts.length - 1][1] - 46).toFixed(0) + "px";
        var gl = $("gridlines");
        [0, 1, 2, 3].forEach(function (k) {
          var y = 92 + k * 56;
          var l = document.createElementNS(NS, "line");
          l.setAttribute("x1", X0); l.setAttribute("x2", 560); l.setAttribute("y1", y); l.setAttribute("y2", y);
          l.setAttribute("stroke", "#1c2431"); l.setAttribute("stroke-width", "1");
          gl.appendChild(l);
        });

        // ---------- insight words + voice bars ----------
        var wordsHost = $("ins-words");
        var ws = [];
        (function split(node) {
          Array.prototype.slice.call(node.childNodes).forEach(function (n) {
            if (n.nodeType === 3) {
              var frag = document.createDocumentFragment();
              n.textContent.split(/(\s+)/).forEach(function (part) {
                if (!part) return;
                if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
                var s = document.createElement("span");
                s.className = "w";
                s.textContent = part;
                frag.appendChild(s);
                ws.push(s);
              });
              node.replaceChild(frag, n);
            } else {
              split(n);
            }
          });
        })(wordsHost);
        var vb = [];
        for (var i = 0; i < 9; i++) {
          var b = document.createElement("div");
          b.className = "vb";
          b.style.left = i * 6.5 + "px";
          $("vbars").appendChild(b);
          vb.push({ el: b, k: 9 + ((i * 4) % 9), p: i * 1.7 });
        }

        var E = {
          o3: gsap.parseEase("power3.out"),
          expo: gsap.parseEase("expo.out"),
          io2: gsap.parseEase("power2.inOut"),
          i2: gsap.parseEase("power2.in"),
        };
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function seg(t, a, d) { return clamp((t - a) / d, 0, 1); }

        var win = $("win"), ins = $("ins"), fcG = $("fc"), fcRect = $("fc-rect"), fcDot = $("fc-dot"), fcLbl = $("fc-lbl");
        var mlDot = $("ml-dot"), mlTxt = $("ml-txt"), audit = $("audit"), brk = $("brk"), kpiGlow = $("kpi-2-glow");
        var lastMl = "";

        function render(t) {
          // gentle drift of the product window (one sine per loop) + slight counter-drift of the overlays
          gsap.set(win, { x: -3 * Math.sin(W * t), y: 6 * Math.sin(W * t + 0.6) });

          // forecast: fades, the model re-runs, the dashed forecast draws back in
          var fade = 1, reveal = 1;
          if (t >= T.fcOut && t < T.fcIn) { fade = 1 - E.i2(seg(t, T.fcOut, 0.3)); }
          else if (t >= T.fcIn) { reveal = E.io2(seg(t, T.fcIn, T.fcDone - T.fcIn)); }
          fcG.style.opacity = fade;
          fcRect.setAttribute("width", (8 + 212 * reveal).toFixed(2));
          var dotP = t >= T.fcIn ? E.o3(seg(t, T.fcDone - 0.1, 0.3)) : fade;
          fcDot.setAttribute("opacity", dotP.toFixed(3));
          fcDot.setAttribute("r", (3 + 4 * dotP).toFixed(2));
          fcLbl.style.opacity = dotP;
          var running = t >= T.fcOut && t < T.fcDone;
          var ml = running ? "run" : "ok";
          if (ml !== lastMl) {
            mlTxt.textContent = running ? "Snowflake ML ···" : "Snowflake ML ✓";
            mlTxt.style.color = running ? "#fcd34d" : "#8a97a8";
            mlDot.style.background = running ? "#fbbf24" : "#5eead4";
            lastMl = ml;
          }

          // AI insight card
          var iv, iy, is, ib;
          if (t >= T.insIn) {
            var p = E.expo(seg(t, T.insIn, 0.5));
            iv = p; iy = 18 * (1 - p); is = 0.96 + 0.04 * p; ib = 8 * (1 - p);
          } else if (t >= T.insOut) {
            var q = E.i2(seg(t, T.insOut, 0.25));
            iv = 1 - q; iy = -10 * q; is = 1; ib = 6 * q;
          } else { iv = 1; iy = 0; is = 1; ib = 0; }
          gsap.set(ins, { opacity: iv, y: iy, scale: is, filter: "blur(" + ib.toFixed(2) + "px)" });
          ws.forEach(function (w, i) {
            w.style.opacity = t >= T.insIn ? E.o3(seg(t, T.insIn + 0.15 + i * 0.075, 0.16)) : 1;
          });
          var speaking = t >= T.insIn ? Math.min(seg(t, T.insIn + 0.05, 0.15), 1 - seg(t, T.insIn + 1.2, 0.2)) : 0;
          vb.forEach(function (b) {
            var a = 0.5 + 0.5 * Math.sin(W * b.k * t + b.p);
            gsap.set(b.el, { scaleY: 0.18 + speaking * 0.82 * (0.25 + 0.75 * a) });
          });
          var au = t >= T.insIn ? E.o3(seg(t, T.audit, 0.3)) : 1;
          gsap.set(audit, { opacity: au, x: -10 * (1 - au) });

          // the insight is about expenses: the tile and the real card light up while it is shown
          var lit = t >= T.insIn ? E.o3(seg(t, T.insIn + 0.35, 0.4)) : 1 - E.i2(seg(t, T.insOut, 0.25));
          kpiGlow.style.opacity = lit;
          brk.style.opacity = lit;
          gsap.set(brk, { scale: 1.04 - 0.04 * lit, transformOrigin: "658px 239px" });
        }

        var proxy = { t: 0 };
        var tl = gsap.timeline({ paused: true });
        tl.to(proxy, { t: LOOP, duration: LOOP, ease: "none", onUpdate: function () { render(proxy.t); } }, 0);
        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
