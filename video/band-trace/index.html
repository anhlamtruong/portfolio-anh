<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=320" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 320px;
        overflow: hidden;
        background: #07090d;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07090d;
      }
    </style>
  </head>
  <body>
    <!-- band-trace: 1920x320, 8 s seamless loop between Projects and Skills -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="320"
    >
      <div
        id="trace"
        data-composition-id="trace"
        data-composition-src="compositions/trace.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="320"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
